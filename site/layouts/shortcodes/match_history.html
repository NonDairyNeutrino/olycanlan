<head>
    <style>
        table {
        border-collapse: collapse;
        width: 100%;
        }

        tr {
        border-bottom: 1px solid #818181;
        }

        tr:hover {background-color: #9bbea0;}
    </style>
</head>

<table>
    <tr>
        <th>Winner</th>
        <th>Loser</th>
        <th>Match Result</th>
        <th>Bounty?</th>
    </tr>
    
    {{ range .Site.Data.examples.matches.current_season.matches }}
    <tr>
        <td>{{.winner}}</td>
        <td>{{.loser}}</td>
        <td>{{.result}}</td>
        <td>
            {{ if .bounty }}
                Yes
            {{ else }}
                No
            {{ end }}
        </td>
    </tr>
    {{end}}
</table>
