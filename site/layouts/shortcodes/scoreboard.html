<head>
    <style>
        table {
        border-collapse: collapse;
        width: 100%;
        }

        tr {
        border-bottom: 1px solid #818181;
        }

        tr:hover {background-color: #9bbea0;}
    </style>
</head>

<table>
    <tr>
        <th>Player</th>
        <th>Points</th>
        <th>Record</th>
    </tr>
    
    {{ range .Site.Data.players.current_season.battlers }}
    <tr>
        <td>{{.discord_nickname}}</td>
        <td>{{.points}}</td>
        <td>{{.league_record}}</td>
    </tr>
    {{end}}
</table>
